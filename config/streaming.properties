# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic=ratings
kafka.user.behavior.topic=taobao_behavior

# Spark
spark.master=local[*]
spark.sql.warehouse.dir=/user/hive/warehouse
spark.sql.shuffle.partitions=4

# Streaming
streaming.trigger.interval=10 seconds
streaming.user.behavior.checkpoint.path=/tmp/spark/checkpoints/luckyanjun_user_behavior

# MySQL is configured through environment variables:
# MYSQL_JDBC_URL, MYSQL_USER, MYSQL_PASSWORD
