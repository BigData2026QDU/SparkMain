# Kafka + Spark Streaming 配置

## Kafka 配置
kafka.bootstrap.servers=localhost:9092
kafka.topic=ratings

## Spark 配置
spark.master=local[*]
spark.sql.warehouse.dir=/user/hive/warehouse
spark.sql.extensions=org.apache.spark.sql.hive.HiveSessionStateBuilder

## Hive 配置
hive.metastore.uris=thrift://localhost:9083
hive.execution.engine=spark

## 流处理配置
streaming.checkpoint.path=/tmp/spark/checkpoints/ratings
streaming.trigger.interval=10 seconds
streaming.output.mode=append
