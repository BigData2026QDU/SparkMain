# Kafka + Spark Streaming 配置

## Kafka 配置
kafka.bootstrap.servers=localhost:9092
kafka.topic=ratings

## Spark 配置
spark.master=local[*]
streaming.output.path=output/streaming/ratings

## 流处理配置
streaming.checkpoint.path=/tmp/spark/checkpoints/ratings
streaming.trigger.interval=10 seconds
streaming.output.mode=append
