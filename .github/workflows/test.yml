name: Test Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Hive
        run: |
          sudo apt-get update
          sudo apt-get install -y hive

      - name: Check SQL syntax
        run: |
          echo "Checking SQL files syntax..."
          for f in jobSQL_test/*.sql initializeSQL_test/*.sql prepareData_test/*.sql; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              # Basic syntax check
              grep -q "SET hive.execution.engine=spark" "$f" || echo "Warning: $f missing Spark engine config"
              grep -q "USE bigdata_ana" "$f" || echo "Warning: $f missing USE database"
            fi
          done

      - name: Check Python scripts
        run: |
          echo "Checking Python scripts..."
          for f in cleanPy_test/*.py; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              python -m py_compile "$f" || exit 1
            fi
          done

      - name: Verify test data
        run: |
          echo "Verifying test data files..."
          for f in dataset_test/*.csv; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              size=$(du -h "$f" | cut -f1)
              echo "$f: $lines lines, $size"
            fi
          done

      - name: Run test pipeline (dry run)
        run: |
          echo "Running test pipeline in dry run mode..."
          # Check if all required files exist
          test -f main_pipeline_test.sh || exit 1
          test -d dataset_test || exit 1
          test -d jobSQL_test || exit 1
          test -d initializeSQL_test || exit 1
          echo "All required files exist"
