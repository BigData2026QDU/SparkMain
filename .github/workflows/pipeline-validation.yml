name: Pipeline Validation

on:
  push:
    branches:
      - main
      - 'luckyanjun/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Scala/Java Spark SQL checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      SPARK_LOCAL_IP: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Apache Spark
        run: |
          wget -q https://archive.apache.org/dist/spark/spark-3.5.0/spark-3.5.0-bin-hadoop3.tgz
          tar xzf spark-3.5.0-bin-hadoop3.tgz
          sudo mv spark-3.5.0-bin-hadoop3 /opt/spark
          echo "SPARK_HOME=/opt/spark" >> $GITHUB_ENV
          echo "/opt/spark/bin" >> $GITHUB_PATH

      - name: Validate Python syntax
        run: |
          python -m py_compile truncate_file.py
          find cleanPy cleanPy_test dataset -name "*.py" -print0 | xargs -0 -r python -m py_compile

      - name: Validate shell syntax
        run: |
          bash -n main_pipeline.sh
          bash -n main_pipeline_test.sh
          bash -n start_streaming.sh
          bash -n start_user_behavior_streaming.sh
          bash -n test/verify_results.sh

      - name: Validate SQL assets exist
        run: |
          test -s initializeSQL/01_create_tables.sql
          test -s prepareData/01_load_data.sql
          test -s jobSQL/06_luckyanjun_funnel_conversion.sql
          test -s jobSQL/07_luckyanjun_time_peak.sql
          test -s jobSQL/08_luckyanjun_category_item_efficiency.sql
          test -s jobSQL/09_luckyanjun_user_segment_retention.sql
          grep -R "USE bigdata_ana" jobSQL/06_luckyanjun_funnel_conversion.sql jobSQL/07_luckyanjun_time_peak.sql jobSQL/08_luckyanjun_category_item_efficiency.sql jobSQL/09_luckyanjun_user_segment_retention.sql

      - name: Verify lightweight test dataset size
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("dataset_test").glob("*.csv"))
          total = sum(path.stat().st_size for path in files)
          print(f"dataset_test files: {[path.name for path in files]}")
          print(f"dataset_test total bytes: {total}")
          if not files:
              raise SystemExit("dataset_test has no CSV files")
          if total > 64 * 1024:
              raise SystemExit("dataset_test must stay below 64 KiB for CI")
          PY

      - name: Compile Spark module
        working-directory: SparkMain
        run: mvn -B -DskipTests package

      - name: Run Spark SQL smoke test via spark-submit
        run: |
          spark-submit \
            --class org.example.ci.SmokeTest \
            --master "local[2]" \
            SparkMain/target/spark-streaming-kafka-1.0.0.jar \
            .
