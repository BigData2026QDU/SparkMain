name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Scala
        uses: olafurpg/setup-scala@v13
        with:
          java-version: adopt@1.17.0-0

      - name: Cache sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Install dependencies
        run: |
          cd SparkMain
          sbt update

      - name: Compile
        run: |
          cd SparkMain
          sbt compile

      - name: Run tests
        run: |
          cd SparkMain
          sbt test

      - name: Build JAR
        run: |
          cd SparkMain
          sbt package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkmain-jar
          path: SparkMain/target/scala-2.12/*.jar

  test-pipeline:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sparkmain-jar
          path: SparkMain/target/scala-2.12/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Check SQL syntax
        run: |
          echo "Checking SQL files syntax..."
          for f in jobSQL_test/*.sql initializeSQL_test/*.sql prepareData_test/*.sql; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              grep -q "SET hive.execution.engine=spark" "$f" || echo "Warning: $f missing Spark engine config"
            fi
          done

      - name: Check Python scripts
        run: |
          echo "Checking Python scripts..."
          for f in cleanPy_test/*.py; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              python -m py_compile "$f" || exit 1
            fi
          done

      - name: Verify test data
        run: |
          echo "Verifying test data files..."
          for f in dataset_test/*.csv; do
            if [ -f "$f" ]; then
              lines=$(wc -l < "$f")
              size=$(du -h "$f" | cut -f1)
              echo "$f: $lines lines, $size"
            fi
          done

      - name: Run test pipeline (dry run)
        run: |
          echo "Running test pipeline in dry run mode..."
          test -f main_pipeline_new.sh || exit 1
          test -d dataset_test || exit 1
          echo "All required files exist"

  release:
    needs: [build, test-pipeline]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: sparkmain-jar
          path: release/jars/

      - name: Create release package
        run: |
          mkdir -p release
          cp -r SparkMain release/
          cp main_pipeline_new.sh release/
          cp README.md release/
          cp config/ release/ -r
          cd release
          zip -r ../sparkmain-release.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## SparkMain Release
            
            ### 包含内容
            - SparkMain JAR 文件
            - 流水线脚本
            - 配置文件
            
            ### 使用方法
            1. 解压发布包
            2. 运行 `./main_pipeline_new.sh`
          files: sparkmain-release.zip
          draft: false
          prerelease: false
