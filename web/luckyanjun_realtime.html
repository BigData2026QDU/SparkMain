<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时经营监控</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 28px 16px;
      background: #ffffff;
      border-bottom: 1px solid #dfe4e8;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0; }
    h2 { margin: 0 0 14px; font-size: 16px; letter-spacing: 0; }
    .subline, #refresh-state { color: #66727d; font-size: 13px; }
    main { width: min(1280px, 100%); margin: 0 auto; padding: 20px 28px 32px; }
    .alert {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-left: 4px solid #1f8a5b;
      background: #edf8f2;
    }
    .alert.warning { border-left-color: #c77700; background: #fff6e6; }
    .alert.danger { border-left-color: #c0392b; background: #fff0ee; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric, .panel {
      background: #ffffff;
      border: 1px solid #dfe4e8;
      border-radius: 6px;
    }
    .metric { min-height: 102px; padding: 14px; }
    .metric span { display: block; color: #66727d; font-size: 12px; }
    .metric strong { display: block; margin-top: 10px; font-size: 26px; letter-spacing: 0; }
    .tables { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { padding: 16px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid #edf0f2; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
    th { color: #66727d; font-weight: 600; }
    .bar-track { width: 100%; height: 5px; background: #e8edf0; }
    .bar { height: 5px; background: #1677b8; }
    .empty { padding: 24px 0; color: #7b8790; text-align: center; }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; padding: 16px; }
      main { padding: 14px 16px 24px; }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .tables { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>5 分钟实时经营监控</h1>
      <div class="subline" id="window-label">等待流数据</div>
    </div>
    <div id="refresh-state">连接中</div>
  </header>
  <main>
    <div class="alert" id="alert">
      <strong id="alert-title">等待数据</strong>
      <span id="alert-message"></span>
    </div>
    <section class="metrics" id="metrics"></section>
    <div class="tables">
      <section class="panel">
        <h2>热门类目 Top10</h2>
        <div id="category-table"></div>
      </section>
      <section class="panel">
        <h2>热门商品 Top10</h2>
        <div id="item-table"></div>
      </section>
    </div>
  </main>
  <script>
    const metricDefinitions = [
      ['pv', 'PV'],
      ['approx_uv', '近似 UV'],
      ['fav_cnt', '收藏数'],
      ['cart_cnt', '加购数'],
      ['buy_cnt', '购买行为数'],
      ['buy_uv', '购买用户数'],
      ['pv_to_buy_rate', '浏览到购买转化率']
    ];

    function renderMetrics(metrics) {
      document.getElementById('metrics').innerHTML = metricDefinitions.map(([key, label]) => {
        const value = key === 'pv_to_buy_rate'
          ? `${((metrics[key] || 0) * 100).toFixed(2)}%`
          : Number(metrics[key] || 0).toLocaleString();
        return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
      }).join('');
    }

    function renderTop(targetId, rows, idKey) {
      const target = document.getElementById(targetId);
      if (!rows.length) {
        target.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const maximum = Math.max(...rows.map(row => row.event_cnt), 1);
      target.innerHTML = `<table>
        <thead><tr><th>排名</th><th>ID</th><th>事件数</th><th>购买数</th></tr></thead>
        <tbody>${rows.map(row => `<tr>
          <td>${row.rank}</td>
          <td>${row[idKey]}<div class="bar-track"><div class="bar" style="width:${row.event_cnt / maximum * 100}%"></div></div></td>
          <td>${row.event_cnt}</td>
          <td>${row.buy_cnt}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    }

    function renderAlert(metrics) {
      const alert = document.getElementById('alert');
      const type = metrics.alert_type || 'normal';
      alert.className = `alert ${type === 'normal' ? '' : type.includes('traffic') ? 'warning' : 'danger'}`;
      document.getElementById('alert-title').textContent =
        type === 'normal' ? '指标正常' : `异常预警：${type}`;
      document.getElementById('alert-message').textContent = metrics.alert_message || '';
    }

    async function refresh() {
      try {
        const response = await fetch(`data/realtime.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const data = await response.json();
        if (!data.metrics) throw new Error('等待首个 Spark micro-batch');
        renderMetrics(data.metrics);
        renderTop('category-table', data.category_top10 || [], 'category_id');
        renderTop('item-table', data.item_top10 || [], 'item_id');
        renderAlert(data.metrics);
        document.getElementById('window-label').textContent =
          `${data.metrics.window_start} 至 ${data.metrics.window_end}`;
        document.getElementById('refresh-state').textContent = `刷新于 ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        document.getElementById('refresh-state').textContent = error.message;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
