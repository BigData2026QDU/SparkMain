<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时经营监控</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 28px 16px;
      background: #ffffff;
      border-bottom: 1px solid #dfe4e8;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0; }
    h2 { margin: 0 0 14px; font-size: 16px; letter-spacing: 0; }
    .subline, #refresh-state { color: #66727d; font-size: 13px; }
    main { width: min(1280px, 100%); margin: 0 auto; padding: 20px 28px 32px; }
    .alert {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border-left: 4px solid #1f8a5b;
      background: #edf8f2;
    }
    .alert.warning { border-left-color: #c77700; background: #fff6e6; }
    .alert.danger { border-left-color: #c0392b; background: #fff0ee; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      background: #ffffff;
      border: 1px solid #dfe4e8;
      border-radius: 6px;
    }
    .metric { min-height: 102px; padding: 14px; }
    .metric span { display: block; color: #66727d; font-size: 12px; }
    .metric strong { display: block; margin-top: 10px; font-size: 26px; letter-spacing: 0; }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; padding: 16px; }
      main { padding: 14px 16px 24px; }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>5 分钟实时经营监控</h1>
      <div class="subline" id="window-label">等待流数据</div>
    </div>
    <div id="refresh-state">连接中</div>
  </header>
  <main>
    <div class="alert" id="alert">
      <strong id="alert-title">等待数据</strong>
      <span id="alert-message"></span>
    </div>
    <section class="metrics" id="metrics"></section>
  </main>
  <script>
    const metricDefinitions = [
      ['pv', 'PV'],
      ['fav_cnt', '收藏数'],
      ['cart_cnt', '加购数'],
      ['buy_cnt', '购买行为数']
    ];

    function renderMetrics(metrics) {
      document.getElementById('metrics').innerHTML = metricDefinitions.map(([key, label]) => {
        const value = Number(metrics[key] || 0).toLocaleString();
        return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
      }).join('');
    }

    function renderAlert(metrics) {
      const alert = document.getElementById('alert');
      const type = metrics.alert_type || 'normal';
      alert.className = `alert ${type === 'normal' ? '' : type.includes('traffic') ? 'warning' : 'danger'}`;
      document.getElementById('alert-title').textContent =
        type === 'normal' ? '指标正常' : `异常预警：${type}`;
      document.getElementById('alert-message').textContent = metrics.alert_message || '';
    }

    async function refresh() {
      try {
        const response = await fetch(`data/realtime.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const data = await response.json();
        if (!data.metrics) throw new Error('等待首个 Spark micro-batch');
        renderMetrics(data.metrics);
        renderAlert(data.metrics);
        document.getElementById('window-label').textContent =
          `${data.metrics.window_start} 至 ${data.metrics.window_end}`;
        document.getElementById('refresh-state').textContent = `刷新于 ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        document.getElementById('refresh-state').textContent = error.message;
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
